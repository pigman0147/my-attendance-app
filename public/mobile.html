<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ลงเวลาทำงาน</title>
        <style>
            body {
                font-family: "Sarabun", sans-serif;
                display: flex;
                justify-content: center;
                margin-top: 50px;
                background-color: #e9ecef;
            }
            .card {
                width: 320px;
                padding: 30px;
                background: white;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
            }
            h2 {
                margin-top: 0;
                color: #333;
            }
            select {
                width: 100%;
                padding: 14px;
                margin: 20px 0;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                background: #fff;
            }
            button {
                width: 100%;
                padding: 14px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 18px;
                cursor: pointer;
            }
            button:disabled {
                background-color: #ccc;
            }
            .message {
                margin-top: 15px;
                font-weight: bold;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>👋 ลงเวลาเข้า/ออก</h2>
            <p style="color: gray; font-size: 0.9rem">
                เลือกชื่อของคุณเพื่อบันทึกเวลา
            </p>

            <select id="username">
                <option value="" disabled selected>
                    -- กำลังโหลดรายชื่อ... --
                </option>
            </select>

            <button onclick="submitAttendance()">✅ บันทึกเวลา</button>
            <div id="msg" class="message"></div>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");

            // 1. โหลดรายชื่อ (กรอง Admin ออกโดย API)
            async function loadUsers() {
                const selectEl = document.getElementById("username");
                try {
                    const res = await fetch("/api/get-users");
                    const users = await res.json();
                    selectEl.innerHTML =
                        '<option value="" disabled selected>-- เลือกชื่อของคุณ --</option>';
                    users.forEach((user) => {
                        const option = document.createElement("option");
                        option.value = user.username;
                        option.textContent = user.name;
                        selectEl.appendChild(option);
                    });
                } catch (err) {
                    console.error(err);
                }
            }
            loadUsers();

            // 2. กดปุ่มบันทึก
            async function submitAttendance() {
                const selectEl = document.getElementById("username");
                const username = selectEl.value;
                const selectedName =
                    selectEl.options[selectEl.selectedIndex]?.text;

                if (!username) return alert("กรุณาเลือกชื่อของคุณก่อนครับ");

                // Confirm Dialog
                if (!confirm(`ยืนยันการลงเวลาของ: ${selectedName} ?`)) return;

                const btn = document.querySelector("button");
                const msgEl = document.getElementById("msg");

                btn.disabled = true;
                btn.innerText = "⏳ กำลังประมวลผล...";

                try {
                    const res = await fetch("/api/qr-checkin", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, token }),
                    });

                    const data = await res.json();

                    if (data.success) {
                        msgEl.innerText = "🎉 " + data.message;
                        msgEl.style.color = "green";

                        // 🔥 จุดสำคัญ: เช็คว่า Server สั่งให้เปลี่ยนหน้าไหม?
                        if (data.redirect) {
                            // ถ้าเป็น User ทั่วไป -> เปลี่ยนหน้า
                            setTimeout(() => {
                                window.location.href = data.redirect;
                            }, 1500);
                        } else {
                            // ถ้าเป็น Admin -> อยู่หน้าเดิม, รีเซ็ตปุ่ม, เคลียร์ชื่อ
                            setTimeout(() => {
                                msgEl.innerText = ""; // เคลียร์ข้อความ
                                btn.disabled = false;
                                btn.innerText = "✅ บันทึกเวลา (คนต่อไป)";
                                selectEl.value = ""; // รีเซ็ต Dropdown
                            }, 2000); // โชว์ข้อความสำเร็จค้างไว้ 2 วิ แล้วค่อยเคลียร์
                        }
                    } else {
                        msgEl.innerText = "⚠️ " + data.message;
                        msgEl.style.color = "red";
                        btn.disabled = false;
                        btn.innerText = "ลองใหม่อีกครั้ง";
                    }
                } catch (err) {
                    msgEl.innerText = "❌ Error Connection";
                    btn.disabled = false;
                }
            }
        </script>
    </body>
</html>
