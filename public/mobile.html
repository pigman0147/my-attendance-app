<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ลงเวลาทำงาน</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Sarabun", sans-serif;
                display: flex;
                justify-content: center;
                margin-top: 50px;
                background-color: #e9ecef;
            }
            .card {
                width: 320px;
                padding: 30px;
                background: white;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
            }
            h2 {
                margin-top: 0;
                color: #333;
            }

            /* Search Box */
            .search-container {
                position: relative;
                margin: 20px 0;
            }
            .search-input {
                width: 100%;
                padding: 14px;
                box-sizing: border-box;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                font-family: "Sarabun", sans-serif;
            }
            .search-input:focus {
                border-color: #007bff;
            }

            /* Results List */
            .results-list {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                border: 1px solid #ddd;
                border-radius: 0 0 8px 8px;
                max-height: 200px;
                overflow-y: auto;
                z-index: 100;
                display: none;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
            .result-item {
                padding: 12px;
                text-align: left;
                border-bottom: 1px solid #f0f0f0;
                cursor: pointer;
            }
            .result-item:hover {
                background-color: #f8f9fa;
                color: #007bff;
            }

            button {
                width: 100%;
                padding: 14px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 18px;
                cursor: pointer;
                font-weight: bold;
                transition: 0.3s;
            }
            button:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }
            #msg {
                margin-top: 20px;
                font-weight: bold;
                font-size: 18px;
                min-height: 27px;
            }

            /* Success Animation */
            .success-animation {
                display: none;
                animation: fadeIn 0.5s;
            }
            .checkmark-circle {
                width: 80px;
                height: 80px;
                margin: 0 auto 20px;
                background: #28a745;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 40px;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="card" id="mainCard">
            <div id="formSection">
                <h2>📸 ยืนยันตัวตน</h2>
                <p style="color: #666; font-size: 14px">
                    พิมพ์ชื่อของคุณเพื่อลงเวลา
                </p>

                <div class="search-container">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="พิมพ์ชื่อของคุณที่นี่..."
                        autocomplete="off"
                    />
                    <div id="resultsList" class="results-list"></div>
                </div>

                <p id="msg"></p>
                <button onclick="doCheckIn()">✅ บันทึกเวลา</button>
            </div>

            <div id="successSection" class="success-animation">
                <div class="checkmark-circle">✓</div>
                <h2 style="color: #28a745">เรียบร้อย!</h2>
                <p id="successMsg" style="font-size: 18px; color: #555"></p>

                <hr
                    style="
                        margin: 20px 0;
                        border: 0;
                        border-top: 1px solid #eee;
                    "
                />

                <p style="color: #999; font-size: 14px">บันทึกข้อมูลแล้ว</p>
                <p style="color: #333; font-weight: bold; font-size: 16px">
                    ❌ กรุณากดปิดหน้านี้ได้เลยครับ
                </p>

                <button
                    onclick="tryClose()"
                    style="background-color: #6c757d; margin-top: 10px"
                >
                    ลองกดปิดหน้านี้
                </button>
            </div>
        </div>

        <script>
            let allUsers = [];
            let selectedUsername = "";

            window.onload = async () => {
                try {
                    const res = await fetch("/api/get-users");
                    allUsers = await res.json();
                } catch (err) {
                    console.error("Error", err);
                }
            };

            const searchInput = document.getElementById("searchInput");
            const resultsList = document.getElementById("resultsList");

            searchInput.addEventListener("input", function () {
                const searchText = this.value.toLowerCase();
                resultsList.innerHTML = "";
                selectedUsername = "";

                if (searchText.length === 0) {
                    resultsList.style.display = "none";
                    return;
                }
                const matches = allUsers.filter((user) =>
                    user.name.toLowerCase().includes(searchText),
                );
                if (matches.length > 0) {
                    matches.forEach((user) => {
                        const div = document.createElement("div");
                        div.className = "result-item";
                        div.innerText = user.name;
                        div.onclick = () => {
                            searchInput.value = user.name;
                            selectedUsername = user.username;
                            resultsList.style.display = "none";
                        };
                        resultsList.appendChild(div);
                    });
                    resultsList.style.display = "block";
                } else {
                    resultsList.style.display = "none";
                }
            });

            document.addEventListener("click", (e) => {
                if (
                    !searchInput.contains(e.target) &&
                    !resultsList.contains(e.target)
                ) {
                    resultsList.style.display = "none";
                }
            });

            async function doCheckIn() {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get("token");

                if (!selectedUsername) {
                    alert("กรุณาเลือกชื่อจากรายการ!");
                    return;
                }
                if (!token) {
                    document.getElementById("msg").innerText = "❌ ไม่พบ Token";
                    return;
                }

                const btn = document.querySelector("button");
                btn.disabled = true;
                btn.innerText = "⏳ กำลังบันทึก...";

                try {
                    const res = await fetch("/api/qr-checkin", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: selectedUsername,
                            token,
                        }),
                    });

                    const data = await res.json();

                    if (data.success) {
                        document.getElementById("formSection").style.display =
                            "none";
                        document.getElementById(
                            "successSection",
                        ).style.display = "block";
                        document.getElementById("successMsg").innerText =
                            data.message;

                        // ลองสั่งปิดอัตโนมัติ (เผื่อใช้ LINE Scan)
                        setTimeout(tryClose, 2000);
                    } else {
                        document.getElementById("msg").innerText =
                            "⚠️ " + data.message;
                        document.getElementById("msg").style.color = "red";
                        btn.disabled = false;
                        btn.innerText = "ลองใหม่";
                    }
                } catch (err) {
                    document.getElementById("msg").innerText = "❌ Error";
                    btn.disabled = false;
                }
            }

            // ฟังก์ชันพยายามปิดหน้าต่าง
            function tryClose() {
                // 1. ลองปิดสำหรับ LINE App (WeChat/LINE Browser)
                if (typeof WeixinJSBridge !== "undefined") {
                    WeixinJSBridge.call("closeWindow");
                    return;
                }

                // 2. ลองปิดสำหรับ Browser ทั่วไป
                window.close();

                // ถ้ายังไม่ปิด (เพราะ Browser บล็อก) ก็ไม่เป็นไร
                // เพราะเราโชว์ข้อความให้ user ปิดเองแล้ว
            }
        </script>
    </body>
</html>
