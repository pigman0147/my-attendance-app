<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ยืนยันตัวตน</title>
        <style>
            body {
                font-family:
                    "Sarabun", sans-serif; /* เปลี่ยนฟอนต์ให้อ่านง่ายขึ้น */
                display: flex;
                justify-content: center;
                margin-top: 50px;
                background-color: #e9ecef;
            }

            .card {
                width: 320px;
                padding: 30px;
                background: white;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            h2 {
                margin-top: 0;
                color: #333;
            }

            /* ปรับแต่ง Dropdown */
            select {
                width: 100%;
                padding: 14px;
                margin: 20px 0;
                box-sizing: border-box;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                background-color: #fff;
                appearance: none; /* ลบลูกศรเดิมของ Browser */
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 1rem center;
                background-size: 1em;
            }

            select:focus {
                border-color: #007bff;
                outline: none;
            }

            button {
                width: 100%;
                padding: 14px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 18px;
                cursor: pointer;
                transition: background 0.3s;
            }

            button:active {
                background-color: #0056b3;
            }
            button:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }

            .message {
                margin-top: 15px;
                font-weight: bold;
                font-size: 14px;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h2>👋 ลงเวลาเข้างาน</h2>
            <p style="color: gray; font-size: 0.9rem">
                กรุณาเลือกชื่อของคุณจากรายการ
            </p>

            <select id="username">
                <option value="" disabled selected>
                    -- กำลังโหลดรายชื่อ... --
                </option>
            </select>

            <button onclick="submitAttendance()">
                ✅ บันทึกเวลา (เข้า/ออก)
            </button>

            <div id="msg" class="message"></div>
        </div>

        <script>
            // ดึง Token จาก URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");

            // ถ้าไม่มี Token ให้แจ้งเตือน
            if (!token) {
                document.body.innerHTML =
                    "<h3 style='text-align:center; color:red; margin-top:50px;'>❌ ไม่พบ Token! <br>กรุณาสแกน QR Code ใหม่</h3>";
            }

            // --- 1. โหลดรายชื่อพนักงานอัตโนมัติ ---
            async function loadUsers() {
                const selectEl = document.getElementById("username");
                try {
                    const res = await fetch("/api/get-users");
                    const users = await res.json();

                    // เคลียร์ตัวเลือกเดิม
                    selectEl.innerHTML =
                        '<option value="" disabled selected>-- เลือกชื่อของคุณ --</option>';

                    // วนลูปสร้างตัวเลือก (Option)
                    users.forEach((user) => {
                        const option = document.createElement("option");
                        option.value = user.username; // ค่าที่จะส่งไปหลังบ้าน
                        option.textContent = user.name; // ชื่อที่จะโชว์ให้เห็น (ชื่อ-สกุล)
                        selectEl.appendChild(option);
                    });
                } catch (err) {
                    console.error(err);
                    selectEl.innerHTML =
                        '<option value="" disabled>❌ โหลดรายชื่อไม่สำเร็จ</option>';
                }
            }

            // เรียกใช้งานฟังก์ชันโหลดรายชื่อทันที
            loadUsers();

            // --- 2. ฟังก์ชันกดปุ่มยืนยัน ---
            async function submitAttendance() {
                const username = document.getElementById("username").value;
                const selectEl = document.getElementById("username");
                const selectedName =
                    selectEl.options[selectEl.selectedIndex].text; // ดึงชื่อที่เลือกมาโชว์

                if (!username) {
                    alert("กรุณาเลือกชื่อของคุณก่อนครับ");
                    return;
                }

                // 🛑 เพิ่ม: ถามยืนยันก่อน (User จะได้ไม่งงว่ากดเข้าหรือออก)
                // แต่เนื่องจากเราไม่รู้สถานะก่อนกด เราจะถามกลางๆ ว่า "ยืนยันการลงเวลา?"
                if (
                    !confirm(`ยืนยันการลงเวลาของ: ${selectedName} ใช่หรือไม่?`)
                ) {
                    return; // ถ้ากด Cancel ก็จบการทำงาน
                }

                const btn = document.querySelector("button");
                const msgEl = document.getElementById("msg");

                btn.disabled = true;
                btn.innerText = "⏳ กำลังประมวลผล...";

                try {
                    const res = await fetch("/api/qr-checkin", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, token }),
                    });

                    const data = await res.json();

                    if (data.success) {
                        // 🎉 แสดงข้อความที่ Server ส่งมา (สวัสดี หรือ กลับบ้านดีๆ)
                        msgEl.innerText = "🎉 " + data.message;
                        msgEl.style.color = "green";

                        // รอ 1.5 วิ แล้วเด้งไปหน้าสรุป
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 1500);
                    } else {
                        msgEl.innerText = "⚠️ " + data.message;
                        msgEl.style.color = "red";
                        btn.disabled = false;
                        btn.innerText = "ยืนยันอีกครั้ง";
                    }
                } catch (err) {
                    msgEl.innerText = "❌ เกิดข้อผิดพลาด";
                    btn.disabled = false;
                }
            }
        </script>
    </body>
</html>
