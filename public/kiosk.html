<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>จุดลงเวลาพนักงาน</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #qrcode {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }

        h1 {
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>สแกนเพื่อลงเวลาเข้างาน</h1>
        <div id="qrcode"></div>
        <p>QR Code จะเปลี่ยนทุก 30 นาที</p>
        <p style="font-size: 0.8em; color: #999;" id="status">กำลังโหลด...</p>
        <br>
        <!--<a href="index.html">กลับหน้า Login</a>-->
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let qrCodeObj = null;

        async function updateQRCode() {
            try {
                const res = await fetch(`${API_URL}/get-qr-token`);
                const data = await res.json();

                // อย่าลืมแก้ localhost เป็น IP เครื่องจริง ถ้าจะให้มือถือสแกนได้
                // แก้ชื่อไฟล์ตรงกลางเป็น mobile.html
                const mobileUrl = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/mobile.html?token=${data.token}`;

                const container = document.getElementById("qrcode");
                container.innerHTML = "";
                qrCodeObj = new QRCode(container, { text: mobileUrl, width: 256, height: 256 });
                document.getElementById('status').innerText = "อัปเดต: " + new Date().toLocaleTimeString();
            } catch (err) { console.error(err); }
        }
        updateQRCode();

        // แก้ตรงนี้ครับ: 30 นาที = 1,800,000 มิลลิวินาที
        setInterval(updateQRCode, 1800000); 
    </script>
</body>

</html>
