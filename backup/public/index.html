<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 50px; background-color: #f0f2f5; }
        .container { width: 350px; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 5px; font-size: 16px; margin-bottom: 10px; }
        .btn-login { background-color: #28a745; color: white; }
        .btn-register { background-color: #007bff; color: white; }
        .btn-kiosk { background-color: #6c757d; color: white; margin-top: 20px; }
        .message { text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ระบบสมาชิก</h2>
        <input type="text" id="username" placeholder="ชื่อผู้ใช้">
        <input type="password" id="password" placeholder="รหัสผ่าน">
        
        <button class="btn-login" onclick="login()">เข้าสู่ระบบ</button>
        <button class="btn-register" onclick="register()">สมัครสมาชิกใหม่</button>
        
        <p id="message" class="message"></p>
        
        <hr>
        <button class="btn-kiosk" onclick="window.location.href='kiosk.html'">เปิดหน้าจอ QR Code (สำหรับบริษัท)</button>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            const msg = document.getElementById('message');
            msg.innerText = data.message;
            msg.style.color = res.ok ? 'green' : 'red';
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                alert('Login สำเร็จ! ยินดีต้อนรับ ' + data.username);
                // ถ้ามีหน้า Dashboard สำหรับ Admin/User ทั่วไป ให้แก้บรรทัดนี้เพื่อเปลี่ยนหน้า
                // window.location.href = 'dashboard.html'; 
            } else {
                const msg = document.getElementById('message');
                msg.innerText = data.message;
                msg.style.color = 'red';
            }
        }
    </script>
</body>
</html>
